name: fork-release

# Собирает пакеты и кладёт их в GitHub Releases.
# Запуск: push тега вида v* (релиз), либо вручную — workflow_dispatch собирает
# артефакты без релиза.
#
# Нумерация: своя, на минор впереди апстрима (апстрим 1.26.1 -> форк 1.27.0).
# Версия тега = PKG_VERSION из luci-app-nikki/Makefile, это проверяется перед
# публикацией. Тег с суффиксом (v1.27.0-rc1, -beta2) публикуется как Pre-release,
# тег без суффикса (v1.27.0) — как обычный релиз.
#
# Матрица урезана до 4 архитектур x 2 веток OpenWrt: полная (как у апстрима)
# это 72 джобы.
#
# Кроме обычных tar.gz релиз содержит feed.tar.gz — каталог фида с подписанными
# индексами. Подпись: KEY_BUILD (usign, opkg) и PRIVATE_KEY (RSA, apk).
# Тот же каталог публикуется на GitHub Pages:
#   https://morningstar2808.github.io/OpenWrt-nikki/<ветка>/<arch>/nikki
# Требует Settings -> Pages -> Source: GitHub Actions.
#
# Релиз создаёт отдельная джоба после матрицы: один вызов action-gh-release
# вместо восьми параллельных, которые дерутся за один и тот же тег.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    # continue-on-error здесь НЕ ставим: с ним упавшая джоба отображается зелёной,
    # и «сборка прошла, релиза нет» выглядит как успешный запуск.
    strategy:
      fail-fast: false
      matrix:
        # Оставьте только свои архитектуры. Узнать свою:
        #   . /etc/openwrt_release; echo "$DISTRIB_ARCH $DISTRIB_RELEASE"
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - mipsel_24kc
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          # mihomo-meta указан явно: у nikki зависимость на виртуальный +mihomo,
          # без явного выбора SDK берёт первого провайдера по алфавиту — alpha.
          PACKAGES: mihomo-meta nikki luci-app-nikki
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: compress
        run: |
          set -eux
          test -d "bin/packages/${{ matrix.arch }}/nikki"
          tar -c -z -f "nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz" \
            -C "bin/packages/${{ matrix.arch }}/nikki" .
          mkdir -p "public/${{ matrix.branch }}/${{ matrix.arch }}"
          cp -a "bin/packages/${{ matrix.arch }}/nikki" \
            "public/${{ matrix.branch }}/${{ matrix.arch }}/nikki"
          tar -c -z -f "feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz" public

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz
          if-no-files-found: error

      - name: upload feed part
        uses: actions/upload-artifact@v7
        with:
          name: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    # always(): если часть архитектур упала, релиз всё равно собираем из того, что есть.
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: check version
        # Тег и PKG_VERSION должны совпадать, иначе релиз v1.27.0 приедет
        # с пакетами 1.26.1 и роутер не увидит обновление.
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          pkg="$(sed -n 's/^PKG_VERSION:=//p' luci-app-nikki/Makefile)"
          echo "тег: $GITHUB_REF_NAME | база версии: $base | luci-app-nikki: $pkg"
          if [ "$base" != "$pkg" ]; then
            echo "::error::тег $GITHUB_REF_NAME не соответствует PKG_VERSION=$pkg в luci-app-nikki/Makefile"
            exit 1
          fi

      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*nikki_*"
          merge-multiple: true

      - name: assemble feed
        env:
          KEY_BUILD_PUB: ${{ secrets.KEY_BUILD_PUB }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          set -eux
          for part in feed_nikki_*.tar.gz; do tar -x -z -f "$part"; done
          rm -f feed_nikki_*.tar.gz
          printf '%s\n' "$KEY_BUILD_PUB" > public/key-build.pub
          printf '%s\n' "$PUBLIC_KEY" > public/public-key.pem
          tar -c -z -f feed.tar.gz public
          ls -l ./*.tar.gz

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # Тег с суффиксом (-rc1, -beta1) -> Pre-release, без суффикса -> обычный релиз.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            nikki_*.tar.gz
            feed.tar.gz
          fail_on_unmatched_files: true

  pages:
    name: pages
    needs: release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4
